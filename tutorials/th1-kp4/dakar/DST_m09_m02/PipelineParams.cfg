#--------------------------Mandatory lines------------------------------#
#------------------You have to modify the lines below-------------------#
#-----------------------------------------------------------------------#

#-------------------------Simulation parameters-------------------------#
LBOX=1000.0 #Linear size of the simulation in Mpc/h
START_SNAP_ID=0 #first snapshot id to analyze (should be equal to zero when using SNAPSHOT_NAMES)
END_SNAP_ID=0 #last snapshot id to analyze
SNAPSHOT_NAMES="/g100_scratch/userexternal/mbaldi00/DAKAR2/snapshot_names.txt" # Makes START_SNAP_ID and END_SNAP_ID useless
NUM_BLOCKS=64 #Number of files per snapshot
BLOCK_NAMES="/g100_scratch/userexternal/mbaldi00/DAKAR2/block_names.txt"
SNAP_FORMAT="GADGET-BINARY" #snapshot format (Supported values: "AREPOHDF5"; "GADGETHDF5"; "GADGET-BINARY"; "RAMSESHDF5S"; or "GIZMOHDF5")
FORCE_RES=0.025 #force resolution of the simulation in Mpc/h
MASS_CONVERSION=1e+10 #Mass unit in the snapshot in Msol/h
LENGTH_CONVERSION=0.001 #Distance unit in the snapshot in Mpc/h
INITIAL_LINPK_FILE="/g100/home/userexternal/mbaldi00/SOURCE/CoDECS2/LCDM_CoDECS2_recalibrated/LCDM_CoDECS2_recalibrated_matterpower_26.dat" #location of the initial power spectrum
INITIAL_LINPK_FORMAT="kP" #format of the input linear spectrum. Possible values: "kP"(columns: k P; default), "log10klog10D" (columns: log10(k) log10(D=P(k)*k^3/((4*pi)^2))"
INITIAL_LINPK_LENGTH_UNITS=3.085678e24 #defines length unit of tabulated input spectrum in cm/h.
INITIAL_LINPK_NORMALIZED_AT_Z0=1 #set to 1 if the initial linear P(k) is normalized with sigma8 and it is having z=0 (present day) values. Otherwise this spectrum will be renormalized with the input SIGMA8 parameter
TABULATED_LINGROWTH="/g100_scratch/userexternal/mbaldi00/DAKAR2/DSC_m09_m02_CoDECS2/linear_growth.txt" # File containing the tabulated linear growth. Expected columns: z, D(z)/D(z=0), f(z). The redshift z column should be in decreasing order. This has to be provided for MG [nDGP, f(R)] and Modified DM simulations. If set to None, the D(z)/D(0) and f(z) functions will be calculated from the cosmological parameters. Only needed for linear P(k) and covariance estimation. 

#-------------------Directories and system parameters-------------------#
SIM_DIR="/g100_scratch/userexternal/mbaldi00/DAKAR2/DSC_m09_m02_CoDECS2/" #Directory of the simulation
SNAP_DIR_BASENAME="snapdir_" #snapshot directory basename
SNAP_BASENAME="DSC_m09_m02_CoDECS2_snap_" #snapshot basename
OUT_DIR="/g100_scratch/userexternal/mbaldi00/DAKAR2/DSC_m09_m02_CoDECS2/Rockstar" #output directory (halo catalogs and every other output will be stored in here.)

#------------------------Cosmological parameters-------------------------#

#Tabulated H(z) background expansion history
MODEL="tabulated" #Cosmological model name. Be sure that this is correct. Possible values: "LCDM", "w0CDM", "w0waCDM", "w0wzCDM", "wpwaCDM", "tabulated"
HFILE="/g100/home/userexternal/mbaldi00/SOURCE/DAKAR2/DSC_m09_m02_Hz.dat" #ASCII file that contains the expansion history as a H(z) function. The pipeline will use this during the halo finding and redhsift-space calculation
H0=67.66 #Hubble constant in km/s/Mpc units
OMEGA_MATTER=0.311049 #Non-relativistic matter density
OMEGA_BARYON=0.04897468161869667 #Baryonic mass density
TCMB=0.0 #in Kelvins
SIGMA8=0.7897181152196091 #Power Spectrum normalization
NS=0.9665 #Spectral index
NEFF=3.046 #Effective number of neutrinos
MNU=0 #Neutrino masses in eV units. If scalar value provided then all neutrino species are assumed to have that mass. The actual number of neutrino species (and hence the number of elements of MNU if it is not scalar) must be the floor of NEFF.
FIT_FIDUCIAL_PARAMS=1 #If zero, it will use the parameters below to calculate the approximate background linear growth. If equals 1, best-fit flat MODEL_FID will be used. 
MODEL_FID="w0waCDM" #Fiducial background cosmological model name. (Can be "LCDM", "w0CDM", or "w0waCDM")
H0_FID=67.66 #Fiducial Hubble constant in km/s/Mpc units
OMEGA_MATTER_FID=0.311049 #Fiducial Non-relativistic matter density
W0_FID=-1.0 #Fiducial dark energy equation of state parameter
WA_FID=0.0 #Fiducial dark energy equation of state parameter

