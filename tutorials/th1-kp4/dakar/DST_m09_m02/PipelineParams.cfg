#--------------------------Pipeline parameters---------------------------#
#----------------You don't have to modify the lines below----------------#
#------------------------------------------------------------------------#

#---------------------------Rockstar settings----------------------------#
EXECUTE_ROCKSTAR=0
FIND_PARENTS=0 #If 1, the find_parents post-process binary will run on each halo catalog to find host halos.
EXECUTE_ADDHALOPARENTS=0 #If 1, the AddHaloParentsID.py module will add the parentID to the main catalog. If 0, the find_parents output will overwrite the generated catalogs
MASS_DEFINITION="200c"
MASS_DEFINITION2="500c"
MASS_DEFINITION3="1000c"
MASS_DEFINITION4="200b"
MASS_DEFINITION5="2500c"
PARALLEL_IO=1
PARALLEL_IO_SERVER_INTERFACE="ib0"
OUTPUT_FORMAT="BOTH"
DELETE_BINARY_OUTPUT_AFTER_FINISHED=1
PRELOAD_PARTICLES=0
MIN_HALO_PARTICLES=10 #FoF halo seed minimum particle number.
MIN_HALO_OUTPUT_SIZE=20 #Note that this option does not specify the minimum number of particles bound within the virial or other halo radius. Instead, it specifies the minimum number of particles which Rockstar identifies as uniquely assigned to that halo. The virial mass can (and usually will) be much less.
PERIODIC=1
UNBOUND_THRESHOLD=0.5 #default: 0.5 To avoid printing spurious halos, Rockstar excludes significantly unbound objects by default. To change the threshold of what is considered “significantly unbound” you may consider lowering this value.
STRICT_SO_MASSES=1 #If you are calculating mass functions, you will want to use spherical overdensities including unbound particles and particles which may exist outside of the FOF group for the halo. To enable these strict SO masses, use 1
PARTICLE_MASS=1 #in Msun/h. It is not necessary to specify the particle mass for GADGET of HDF5 files, but itis necessary for all other file types.
PARTILCE_OUTPUT=2 #output full particle information (0: no particle output; 1: ASCII format output; 2: BGC2 format output)
DELETE_TMP_FILES=0 #set it to 1 to automatically remove the generated temporary ASCII or BGC2 output files after the pipeline is finished.
DELETE_UNWANTED_BGC2_FILES=1 #set it to 1 to remove the bgc2 files that are not needed for KP-CL-3 Paper 5 (z in 0, 0.125, 0.25, 0.375, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0)
TEMPORAL_HALO_FINDING=0 #If computing mass functions for snapshots widely separated in redshift, you may also wish to disable temporal halo finding (i.e.,using information from previous snapshots to determine host/sub relationships)
FOF_FRACTION=0.7 #FOF refinement fraction. default 0.7
FOF_LINKING_LENGTH=0.28 #3D FOF linking length. default 0.28
EXACT_LL_CALC=0 #set this to 1 for "more deterministic" (but slower) halo property calculation. (N>1e4 halos are randomly sampled if this is 0)

#---------------Halo Radial Density Profile Calculation-----------------#
HRDP=0
HRDP_NBINS=50 #Number of radial profile bins
HRDP_NMIN=1000 #Minimal particle number
HRDP_FILEBASENAME="hrdp_snap"

#---------------------------HMF calculation-----------------------------#
HMF=0 #if 1, the pipeline will calculate HMF function from the Rockstar catalog
HMFBINS=32 #Number of mass bins
HMFMINMASS=1e11 #in Msol/h
HMFMAXMASS=1e15 #in Msol/h
HMF_MAXTHREADS=4 # Maximal number of parallel HMF calculation
HMF_EXCLUDE_SUBSTRUCTURES=1 # if 1, the HMF calculation will only use main halos.
HMF_USE_SO_MASSES=2 # if 0: the HMF calculator will only use BO halo masses; if 1: SO masses will be used; if 2: both SO and BO HMF will be calculated

#-----------------------Power spectra calculation----------------------#
PKNGRID=512
KMIN=0.5 #minimal k in kf=2*pi/L units
KMAX=0 #maximal k in h/Mpc. Set 0, for the default Nyquist frequency
DK_KF=1.0 #k bin size in kf=2*pi/L units
NDIR=3 #Number of independent directions (LOS) for distant observer approximation (for redshift space multipoles)
NMU=25 #number of mu values for multipole calculation (for redshift space multipoles)
#---------------------DM power spectra calculation----------------------#
DM_RSPACE_PK=0
RSPACE_DMPK_BASENAME="rspace_DM_Pk_snap_"
DM_ZSPACE_PK=0
ZSPACE_DMPK_BASENAME="zspace_DM_Pk_snap_"
#--------------------Halo power spectra calculation---------------------#
MIN_HALO_MASS=5.011872336272715e12 # 10^12.7 Msol/h
MAX_HALO_MASS=1.584893192461111e13 # 10^13.2 Msol/h
HALO_RSPACE_PK=0
RSPACE_HALOPK_BASENAME="rspace_HaloPk_M12p7_M13p2_snap_"
HALO_ZSPACE_PK=0
ZSPACE_HALOPK_BASENAME="zspace_HaloPk_M12p7_M13p2_snap_"
MASS_COLUMN="BO" #Must be SO (for strict spherical overdensity masses) or BO (for bound only masses)
HALO_PK_EXCLUDE_SUBSTRUCTURES=0 # if 1, the halo power spectrum calculator will not use substructures.

#------------Halo bias estimation from rspace power spectra-------------#
HALO_BIAS=0
BIAS_KMAX=0.1
GROWTH_F=1
GROWTH_D=1
#------Linear power spectrum & Halo Gaussian covariance estimation------#
HALO_GCOV=1
ZSPACE_HALOGCOV_MODE="Comet" #Possible values: "LinearPk_and_bias" or "Comet"
ZSPACE_HALOGCOV_BASENAME="zspace_HaloGCov_M12p7_M13p2"
SAVE_LIN_PK=1
LINSPEC_BASENAME="linear_powerspec_snap_"

#------------------Halo Density Field Reconstruction--------------------#
HDF=1
HDF_NGRID=512 # Same as NGRID
HDF_COMPENSATED=0
HDF_INTERLACED=0
HDF_MODE="tsc" #Can be "NEAREST" for Nearest Grid Point, or "tsc" for Triangular Shaped Cloud
HDF_FILEBASENAME="hdf_snap"

#-------------------DM Density Field Reconstruction---------------------#
DMDF=1
DMDF_NGRID=512 # ame as NGRID
DMDF_COMPENSATED=0
DMDF_INTERLACED=0
DMDF_MODE="tsc" #Can be "NEAREST" for Nearest Grid Point, or "tsc" for Triangular Shaped Cloud
DMDF_FILEBASENAME="dmdf_snap"

#-----------------------------Void Finding-----------------------------#
VIDE=0
VIDE_OUTPUT_FORMAT="dat" # Output format: if 'hdf5' or 'h5' -> hdf5 file, otherwise ascii table
OPTIMIZED_OUTPUT=1 #If 1 generates a slim output, if 0 generates 3 files with some redundant and ambiguous information for boxes
VIDE_MIN_HALO_MASS=8.04e12 #Msol/h #~100*Mpart
VIDE_EXCLUDE_SUBSTRUCTURES=0 # If 1 consider parent halos only.
VIDE_OVERWRITE_PROGRESS=0 # If 1 it will run the entire pipeline overwriting all the files. If 0 it will not re-analyze the successful jobs already analyzed
VIDE_R_MIN_VOIDS=1.0 # Mpc/h minimum void radius to be considered. If r_min_voids < 0, then r_min_voids will be set equal to the mean particle separation = (n_part / lbox^3)^(-1/3)
VIDE_MIN_NUMBER_OF_TRACERS=1 # If you have less that minimum_number_of_tracers number of halos, the void finder will not be lauched
VIDE_NUM_ZOBOV_THREADS=-1 # Maximum number of parallel threads to use. If <= 0  automatically set to the number of available threads.
VIDE_NUM_ZOBOV_DIVISIONS=2 # Number of subdivisions of the box sides, the lower the faster. To account for periodic-boundary-condition numZobovDivisions >= 2
VIDE_MERGING_THRESHOLD=1e-9 # Maximum density for merging voids